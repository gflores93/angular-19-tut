<h1>Counter App</h1>

<div class="btn-container">
    <h3 class="count">{{count}}</h3>
    <div>
        <button class="btn bg-red" (click)="handleCounter(Action.Decrement)">Decrement</button>
        <button class="btn bg-black" (click)="handleCounter(Action.Reset)">Reset</button>
        <button class="btn bg-green" (click)="handleCounter(Action.Increment)">Incremeent</button>
    </div>
</div>
